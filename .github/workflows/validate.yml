name: El Chamán · Validación funcional
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar estructura y fases
        run: node --test tests/smoke.test.mjs
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar flujo móvil y meditación
        run: node --test tests/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: el-chaman-captura-movil
          path: screenshots/
          if-no-files-found: ignore
